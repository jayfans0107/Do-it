<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F5F7">
<meta name="apple-mobile-web-app-title" content="成长OS">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Personal Growth OS</title>
<style>
/* ===== RESET ===== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}

/* ===== VARIABLES ===== */
:root{
  --bg:#F5F5F7;--surface:#FFFFFF;--text:#1D1D1F;--text-2:#6E6E73;--text-3:#AEAEB2;
  --border:#E5E5EA;--border-2:#F2F2F7;--accent:#5E5CE6;--accent-bg:#EDEDFC;
  --day:#E8A33D;--day-bg:#FEF6EC;--day-surface:#FFFCF7;
  --night:#5E5CE6;--night-bg:#F5F5FE;--night-surface:#FAFAFF;
  --green:#34C759;--green-bg:#E8F8EC;--amber:#FF9F0A;--amber-bg:#FEF3E2;
  --red:#FF3B30;--red-bg:#FFEBE9;--gray-bg:#F2F2F7;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.02);
  --shadow-lg:0 8px 24px rgba(0,0,0,.06);
  --radius:14px;--radius-sm:10px;--radius-xs:6px;--nav-h:58px;
}

/* ===== BASE ===== */
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
input,textarea,select,button{font-family:inherit;font-size:inherit}
button{border:none;background:none;cursor:pointer;color:inherit}
textarea{resize:vertical}
::placeholder{color:var(--text-3)}

/* ===== LAYOUT ===== */
#app{max-width:500px;margin:0 auto;min-height:100vh;padding:16px 16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
.page{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page-header{margin-bottom:20px}
.page-header h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:2px}
.page-header p{font-size:13px;color:var(--text-2)}
.section-header{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);margin-bottom:12px}
.section-subtitle{font-size:12px;color:var(--text-2);margin-bottom:14px;margin-top:-8px}

/* ===== NAV ===== */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-around;padding-top:6px;padding-bottom:env(safe-area-inset-bottom,0);z-index:100;max-width:500px;margin:0 auto}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;color:var(--text-3);transition:color .15s;flex:1}
.nav-item.active{color:var(--accent)}
.nav-item svg{width:20px;height:20px}

/* ===== CARDS ===== */
.card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}

/* ===== STREAK CARD ===== */
.streak-card{
  position:relative;overflow:hidden;
  background:var(--surface);
  border:1px solid var(--border-2);
  border-radius:var(--radius);padding:24px 20px;margin-bottom:12px;
  box-shadow:var(--shadow);text-align:center;
  transition:background .4s ease;
}
.streak-card.s1{background:var(--surface)}
.streak-card.s2{background:linear-gradient(135deg,#FFF9F0 0%,#FFFFFF 60%)}
.streak-card.s3{background:linear-gradient(135deg,#FFF4E0 0%,#FFFDF8 50%)}
.streak-card.s4{background:linear-gradient(135deg,#FFEFD0 0%,#FFFAF0 40%)}
.streak-card.s5{background:linear-gradient(135deg,#FFE5B0 0%,#FFF5E0 30%)}
.streak-card.s6{background:linear-gradient(135deg,#FFD78A 0%,#FFEFC0 25%)}
.streak-card.s7{background:linear-gradient(135deg,#FFC957 0%,#FFE0A0 20%)}
.streak-card.s7plus{background:linear-gradient(135deg,#FF9F0A 0%,#FFD060 30%,#FFE8B0 60%)}
.streak-glow{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:200px;height:200px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,159,10,.12),transparent 70%);
  opacity:0;transition:opacity .4s ease;
}
.streak-card.s3 .streak-glow{opacity:.3}
.streak-card.s4 .streak-glow{opacity:.5}
.streak-card.s5 .streak-glow{opacity:.7}
.streak-card.s6 .streak-glow{opacity:.85}
.streak-card.s7 .streak-glow{opacity:1}
.streak-card.s7plus .streak-glow{opacity:1;background:radial-gradient(circle,rgba(255,159,10,.2),transparent 70%)}
.streak-header{
  position:relative;z-index:1;
  font-size:11px;font-weight:600;letter-spacing:.06em;
  color:var(--text-3);margin-bottom:4px;
}
.streak-number{
  position:relative;z-index:1;
  font-size:64px;font-weight:800;letter-spacing:-.05em;line-height:1.1;
  color:var(--text);transition:color .4s ease;
}
.streak-card.s2 .streak-number{color:#C4952E}
.streak-card.s3 .streak-number{color:#B88420}
.streak-card.s4 .streak-number{color:#A87318}
.streak-card.s5 .streak-number{color:#D4850A}
.streak-card.s6 .streak-number{color:#E87800}
.streak-card.s7 .streak-number{
  background:linear-gradient(135deg,#FF9F0A,#FF6B35);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.streak-card.s7plus .streak-number{
  background:linear-gradient(135deg,#FF6B35,#FF3B30,#FF9F0A);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.streak-unit{
  position:relative;z-index:1;
  font-size:14px;font-weight:500;color:var(--text-3);margin-top:2px;
}
.streak-sub{
  position:relative;z-index:1;
  font-size:11px;color:var(--text-3);margin-top:12px;
  padding-top:12px;border-top:1px solid var(--border-2);
  display:flex;justify-content:center;gap:16px;
}
.streak-main{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;gap:4px;
  margin-bottom:2px;
}
.streak-flame-wrap{
  display:inline-flex;align-items:center;
  animation:flameFlicker 1.8s ease-in-out infinite;
  transform-origin:bottom center;
}
@keyframes flameFlicker{
  0%,100%{transform:scale(1) rotate(-2deg)}
  25%{transform:scale(1.08) rotate(1deg)}
  50%{transform:scale(.95) rotate(-1deg)}
  75%{transform:scale(1.05) rotate(2deg)}
}
.streak-card.s7plus .streak-flame-wrap{
  animation:flameFlickerBig 1.2s ease-in-out infinite;
  filter:drop-shadow(0 0 8px rgba(255,107,53,.4));
}
@keyframes flameFlickerBig{
  0%,100%{transform:scale(1) rotate(-3deg)}
  33%{transform:scale(1.12) rotate(2deg)}
  66%{transform:scale(.92) rotate(-2deg)}
}

/* ===== RATE CARD ===== */
.rate-card{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#5E5CE6 0%,#7B68EE 50%,#9370DB 100%);
  border-radius:var(--radius);padding:22px 18px 18px;margin-bottom:12px;
  box-shadow:0 8px 24px rgba(94,92,230,.25),inset 0 1px 0 rgba(255,255,255,.1);
  color:#fff;
}
.rate-card::before{
  content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;
  border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none;
}
.rate-card::after{
  content:'';position:absolute;bottom:-20px;left:-20px;width:80px;height:80px;
  border-radius:50%;background:rgba(255,255,255,.04);pointer-events:none;
}
.rate-card-header{
  position:relative;z-index:1;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:rgba(255,255,255,.65);margin-bottom:18px;
  display:flex;align-items:center;gap:6px;
}
.rate-circles{
  position:relative;z-index:1;
  display:flex;justify-content:space-around;gap:12px;
}
.rate-circle-wrap{
  text-align:center;
  display:flex;flex-direction:column;align-items:center;
}
.rate-circle-svg{
  width:90px;height:90px;transform:rotate(-90deg);
}
.rate-circle-track{fill:none;stroke:rgba(255,255,255,.12);stroke-width:6}
.rate-circle-fill{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.rate-circle-fill.weekly{stroke:url(#gradWeekly)}
.rate-circle-fill.monthly{stroke:url(#gradMonthly)}
.rate-circle-inner{
  position:absolute;margin-top:22px;
  display:flex;flex-direction:column;align-items:center;
}
.rate-circle-value{font-size:22px;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1}
.rate-circle-unit{font-size:11px;font-weight:500;color:rgba(255,255,255,.5);margin-top:1px}
.rate-circle-label{
  font-size:12px;font-weight:600;color:rgba(255,255,255,.85);margin-top:10px;
}
.rate-circle-sublabel{
  font-size:10px;color:rgba(255,255,255,.45);margin-top:2px;
}

/* ===== HOME ===== */
.today-date{font-size:24px;font-weight:800;letter-spacing:-.02em}
.today-sub{font-size:13px;color:var(--text-2);margin-top:2px;margin-bottom:16px}
.section-day{background:var(--day-surface);border:1px solid #F5E6D0;border-radius:var(--radius);padding:18px;margin-bottom:12px}
.section-day .section-header{color:var(--day)}
.section-night{background:var(--night-surface);border:1px solid #DDD9FB;border-radius:var(--radius);padding:18px;margin-bottom:12px}
.section-night .section-header{color:var(--night)}
.section-day .section-subtitle,.section-night .section-subtitle{color:var(--text-2);font-size:12px;margin-bottom:14px;margin-top:-8px}
.recovery-banner{display:inline-block;font-size:11px;font-weight:600;color:var(--night);background:var(--night-bg);padding:3px 10px;border-radius:20px;margin-bottom:10px}
.recovery-message{text-align:center;font-size:13px;color:var(--text-3);padding:12px;font-style:italic}

/* ===== APPROVAL ===== */
.approval-card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);text-align:center}
.approval-question{font-size:15px;font-weight:600;color:var(--text);margin-bottom:14px}
.approval-btns{display:flex;gap:14px;justify-content:center}
.approval-btn{width:64px;height:64px;border-radius:50%;border:2.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:28px;transition:all .2s;background:var(--surface);color:var(--text-3)}
.approval-btn.approved{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.approval-btn.rejected{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.approval-btn:active{transform:scale(.92)}
.approval-label{font-size:11px;color:var(--text-3);margin-top:6px;font-weight:500}

/* ===== MOOD WEATHER (INLINE) ===== */
.home-top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.home-header-left h1{font-size:22px;font-weight:700;line-height:1.2}
.home-header-left p{font-size:12px;color:var(--text-3);margin-top:2px}
.mood-picker{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:280px}
.mood-picker-btn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 6px;border-radius:8px;border:1.5px solid transparent;background:transparent;cursor:pointer;transition:all .12s}
.mood-picker-btn:active{transform:scale(.9)}
.mood-picker-btn:hover{border-color:var(--border-2);background:var(--surface)}
.mood-picker-icon{width:32px;height:32px}
.mood-picker-icon svg{width:100%;height:100%}
.mood-picker-label{font-size:11px;color:var(--text-3);font-weight:500}

.mood-selected{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px;border-radius:10px;transition:all .12s}
.mood-selected:active{transform:scale(.95)}
.mood-selected-icon{width:48px;height:48px}
.mood-selected-icon svg{width:100%;height:100%}
.mood-selected-label{font-size:14px;font-weight:600;color:var(--text-2)}

/* ===== TASK ITEM ===== */
.task-item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-sm);margin-bottom:6px;transition:all .15s}
.task-item:active{transform:scale(.98)}
.task-check{width:22px;height:22px;border:2px solid var(--text-3);border-radius:6px;flex-shrink:0;cursor:pointer;transition:all .15s;position:relative}
.task-check.checked{background:var(--green);border-color:var(--green)}
.task-check.checked::after{content:'';position:absolute;left:5px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.task-title{flex:1;font-size:14px;line-height:1.4;color:var(--text);transition:all .15s}
.task-item.completed .task-title{text-decoration:line-through;color:var(--text-3)}
.task-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap;flex-shrink:0}
.task-delete{width:22px;height:22px;font-size:16px;color:var(--text-3);opacity:.35;transition:opacity .15s;flex-shrink:0}
.task-item:hover .task-delete{opacity:1}
.task-edit-btn{width:22px;height:22px;font-size:14px;color:var(--text-3);opacity:.35;transition:opacity .15s;flex-shrink:0}
.task-item:hover .task-edit-btn{opacity:1}
.task-edit-input{flex:1;border:1px solid var(--accent);border-radius:var(--radius-xs);padding:4px 8px;font-size:14px;outline:none;background:var(--surface)}
.task-edit-save{width:22px;height:22px;font-size:14px;color:var(--green);flex-shrink:0}
.task-edit-cancel{width:22px;height:22px;font-size:16px;color:var(--red);flex-shrink:0}
.task-item.editing{background:var(--accent-bg);border-color:var(--accent)}

/* ===== ADD TASK ===== */
.add-task-btn{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:9px;border:1.5px dashed var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--text-3);font-size:13px;transition:all .15s}
.add-task-btn:hover,.add-task-btn:active{border-color:var(--accent);color:var(--accent)}
.add-task-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:6px}
.add-task-input{width:100%;border:1px solid var(--border);border-radius:var(--radius-xs);padding:8px 10px;font-size:14px;margin-bottom:8px;outline:none}
.add-task-input:focus{border-color:var(--accent)}
.priority-selector{display:flex;gap:6px;margin-bottom:8px}
.priority-btn{padding:4px 10px;font-size:11px;font-weight:600;border-radius:var(--radius-xs);border:1px solid var(--border);background:var(--surface);color:var(--text-2);transition:all .15s}
.priority-btn.active.must{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.priority-btn.active.should{background:var(--amber-bg);color:var(--amber);border-color:var(--amber)}
.priority-btn.active.optional{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.add-task-actions{display:flex;gap:8px}
.btn-add{padding:6px 14px;border-radius:var(--radius-xs);font-size:13px;font-weight:600;background:var(--accent);color:#fff}
.btn-cancel{padding:6px 14px;border-radius:var(--radius-xs);font-size:13px;background:var(--border-2);color:var(--text-2)}
.task-limit-warn{font-size:12px;color:var(--amber);padding:6px 0}
.task-presets{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.task-preset{padding:4px 10px;font-size:12px;font-weight:500;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);transition:all .15s;white-space:nowrap}
.task-preset:active{transform:scale(.95)}
.task-preset.selected{background:var(--accent);border-color:var(--accent);color:#fff}

/* ===== ENERGY ===== */
.energy-card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.energy-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.energy-row+.energy-row{border-top:1px solid var(--border-2)}
.energy-label{font-size:13px;color:var(--text-2);font-weight:500}
.energy-dots{display:flex;gap:7px}
.energy-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);transition:all .15s;cursor:pointer}
.energy-dot.active{background:var(--accent);border-color:var(--accent)}

/* ===== OPINION ===== */
.opinion-card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.opinion-input{width:100%;border:1px solid var(--border-2);border-radius:var(--radius-xs);padding:10px;font-size:13px;resize:vertical;min-height:70px;outline:none;background:var(--bg);color:var(--text)}
.opinion-input:focus{border-color:var(--accent);background:var(--surface)}

/* ===== DAY/NIGHT PAGE ===== */
.day-intro{background:var(--day-bg);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.day-intro p{font-size:13px;color:var(--text-2);line-height:1.5}
.category-section{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.category-header{display:flex;align-items:center;justify-content:space-between;padding-left:10px;margin-bottom:10px}
.category-name{font-size:14px;font-weight:600;color:var(--text)}
.category-count{font-size:11px;color:var(--text-3);background:var(--border-2);padding:2px 8px;border-radius:10px;font-weight:500}
.empty-hint{font-size:13px;color:var(--text-3);text-align:center;padding:8px 0}
.recovery-toggle{display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.recovery-toggle.active{background:var(--night-bg);border-color:var(--night)}
.recovery-info{display:flex;flex-direction:column;gap:2px}
.recovery-title{font-size:14px;font-weight:600}
.recovery-desc{font-size:12px;color:var(--text-2)}
.toggle-switch{width:44px;height:26px;background:var(--border);border-radius:13px;position:relative;transition:background .2s;flex-shrink:0}
.toggle-switch.on{background:var(--night)}
.toggle-knob{position:absolute;top:2px;left:2px;width:22px;height:22px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle-switch.on .toggle-knob{transform:translateX(18px)}

/* ===== REVIEW ===== */
.review-tabs{display:flex;background:var(--border-2);border-radius:10px;padding:3px;margin-bottom:16px}
.review-tab{flex:1;padding:8px;border:none;background:transparent;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-2);transition:all .15s}
.review-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.day-sub-tabs{display:flex;background:var(--border-2);border-radius:10px;padding:3px;margin-bottom:14px}
.day-sub-tab{flex:1;padding:8px;border:none;background:transparent;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-2);transition:all .15s}
.day-sub-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}
.book-section{padding-bottom:20px}
.book-card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);transition:transform .15s}
.book-card:active{transform:scale(.98)}
.book-reminder-card{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.85}}
.review-stats-card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.review-stat-row{display:flex;align-items:center;gap:10px}
.stat-label{font-size:18px}
.stat-bar{flex:1;height:10px;background:var(--border-2);border-radius:5px;overflow:hidden}
.stat-fill{height:100%;border-radius:5px;transition:width .6s ease}
.stat-value{font-size:16px;font-weight:800;color:var(--text);min-width:50px;text-align:right}
.streak-sub-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);margin-top:8px;padding-top:8px;border-top:1px solid var(--border-2)}

/* Heatmap */
.heatmap-card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.heatmap{display:flex;flex-direction:column;gap:6px}
.heatmap-row{display:flex;align-items:center;gap:4px}
.heatmap-label{width:28px;text-align:center;font-size:13px;flex-shrink:0}
.heatmap-cell{flex:1;aspect-ratio:1;border-radius:8px;background:var(--gray-bg);max-width:44px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .15s;border:2px solid transparent}
.heatmap-cell:active{transform:scale(.9)}
.heatmap-cell.approved{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.heatmap-cell.approved.weekend{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.heatmap-cell.rejected{background:var(--red-bg);border-color:rgba(255,59,48,.4);color:var(--red)}
.heatmap-cell.unfilled{background:var(--gray-bg);color:var(--text-3);font-size:11px}
.heatmap-cell.today{box-shadow:0 0 0 2px var(--accent)}
.heatmap-day-header{flex:1;text-align:center;font-size:10px;color:var(--text-3);max-width:44px}
.heatmap-day-header.weekend{color:var(--amber)}

/* Trend Chart */
.trend-card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.trend-svg{width:100%;height:130px}
.trend-legend{display:flex;gap:14px;justify-content:center;margin-top:8px}
.trend-legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-2)}
.trend-legend-dot{width:8px;height:8px;border-radius:50%}

/* Questions */
.question-card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);padding:16px;margin-bottom:8px;box-shadow:var(--shadow)}
.question-label{display:block;font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px}
.question-input{width:100%;border:1px solid var(--border-2);border-radius:var(--radius-xs);padding:10px;font-size:13px;resize:vertical;min-height:56px;outline:none;color:var(--text)}
.question-input:focus{border-color:var(--accent)}

/* Top 3 */
.top3-card{background:var(--accent-bg);border:1px solid #D9D7F8;border-radius:var(--radius);padding:16px;margin-bottom:10px}
.top3-card .section-header{color:var(--accent)}
.top3-input{width:100%;border:1px solid rgba(94,92,230,.15);border-radius:var(--radius-xs);padding:8px 10px;font-size:13px;margin-bottom:6px;outline:none;background:var(--surface)}
.top3-input:last-child{margin-bottom:0}
.top3-input:focus{border-color:var(--accent)}

/* Total Review */
.monthly-intro{text-align:center;padding:12px 0;margin-bottom:8px}
.monthly-question{font-size:16px;font-weight:700;color:var(--text)}
.monthly-score-card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);padding:16px;margin-bottom:8px;box-shadow:var(--shadow)}
.score-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.score-name{font-size:14px;font-weight:600;color:var(--text)}
.score-value{font-size:20px;font-weight:800;color:var(--accent)}
.score-slider{width:100%;-webkit-appearance:none;height:6px;background:var(--border-2);border-radius:3px;outline:none;margin-bottom:8px}
.score-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:var(--accent);border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.score-slider::-moz-range-thumb{width:14px;height:14px;background:var(--accent);border-radius:50%;cursor:pointer;border:3px solid #fff}
.score-reason{width:100%;border:1px solid var(--border-2);border-radius:var(--radius-xs);padding:8px;font-size:12px;color:var(--text-2);resize:vertical;min-height:36px;outline:none}
.score-reason:focus{border-color:var(--accent)}

/* Memo */
.memo-card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.memo-date{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border-2)}
.memo-content{font-size:14px;line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word}
.memo-tag{display:inline-block;font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-bg);padding:2px 6px;border-radius:4px;margin-right:6px;vertical-align:middle}
.memo-search-bar{margin-bottom:10px}
.memo-search-input{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;outline:none;background:var(--surface);transition:border-color .15s}
.memo-search-input:focus{border-color:var(--accent)}
.memo-filters{display:flex;gap:6px;margin-bottom:12px}
.memo-filter{padding:5px 12px;font-size:12px;font-weight:500;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);transition:all .15s}
.memo-filter.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ===== GROWTH PAGE ===== */
.output-filters{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.output-filter{padding:4px 10px;font-size:12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);transition:all .15s}
.output-filter.active{background:var(--accent);border-color:var(--accent);color:#fff}
.output-item{display:flex;align-items:flex-start;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-sm);margin-bottom:6px;box-shadow:var(--shadow)}
.output-icon{width:36px;height:36px;border-radius:8px;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.output-title{font-size:14px;font-weight:600;color:var(--text)}
.output-meta{font-size:12px;color:var(--text-3);margin-top:2px}
.output-desc{font-size:12px;color:var(--text-2);margin-top:4px;line-height:1.4}
.add-output-form{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-sm);padding:12px;margin-top:6px}
.output-type-select{width:100%;border:1px solid var(--border);border-radius:var(--radius-xs);padding:8px 10px;font-size:13px;margin-bottom:8px;outline:none;background:var(--surface)}
.output-title-input,.output-desc-input{width:100%;border:1px solid var(--border-2);border-radius:var(--radius-xs);padding:8px 10px;font-size:13px;margin-bottom:8px;outline:none;color:var(--text)}
.output-desc-input{resize:vertical;min-height:48px}

/* Calendar */
.calendar-card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);overflow:visible}
.calendar-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.calendar-nav-btn{width:32px;height:32px;border-radius:8px;background:var(--border-2);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-2);transition:all .15s}
.calendar-nav-btn:active{background:var(--accent-bg);color:var(--accent)}
.calendar-title{font-size:15px;font-weight:700;color:var(--text)}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;overflow:visible;padding-top:6px}
.calendar-dow{text-align:center;font-size:10px;color:var(--text-3);font-weight:600;padding-bottom:4px}
.calendar-dow.weekend{color:var(--amber)}
.cal-day{position:relative;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;padding:6px 2px;cursor:pointer;transition:all .12s}
.cal-day:active{transform:scale(.95)}
.cal-day.today{border:2px solid #34C75940;background:#34C75908}
.cal-day-num{position:absolute;top:3px;left:6px;font-size:13px;font-weight:600;color:var(--text-3)}
.cal-day-mood{position:absolute;top:3px;right:4px;width:14px;height:14px}
.cal-day-mood svg{width:100%;height:100%}
.cal-day-emojis{font-size:16px;display:flex;gap:3px;align-items:center;margin-top:6px}
.cal-day-bar{position:absolute;bottom:3px;left:6px;right:6px;height:4px;border-radius:2px}
.cal-day-crown{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:18px;height:12px;z-index:3;pointer-events:none}
.cal-day-crown svg{width:100%;height:100%}
.cal-day.other-month{opacity:.3}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;padding:8px 0 4px;font-size:11px;color:var(--text-3)}
.cal-legend-item{display:flex;align-items:center;gap:4px}

/* ===== FIT CALENDAR (monthly) ===== */
.fit-cal-day{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:all .15s;border:1.5px solid transparent;background:var(--surface);color:var(--text);position:relative}
.fit-cal-day:active{transform:scale(.9)}
.fit-cal-day.out-of-plan{background:transparent;color:var(--text-3);opacity:.35;cursor:default}
.fit-cal-day.rest-day{background:var(--gray-bg)}
.fit-cal-day.completed{background:var(--green-bg);border-color:var(--green)}
.fit-cal-day.today{box-shadow:0 0 0 2px var(--accent)}
.fit-cal-day-num{font-size:10px;color:var(--text-3);position:absolute;top:2px;left:4px;font-weight:600}
.fit-cal-day.completed .fit-cal-day-num{color:var(--green)}
.fit-cal-legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;font-size:10px;color:var(--text-3)}
.fit-cal-legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;vertical-align:middle}

/* ===== HISTORY DAY VIEW ===== */
.history-back{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--accent);margin-bottom:16px;cursor:pointer;font-weight:600}
.history-date{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:2px}
.history-sub{font-size:13px;color:var(--text-2);margin-bottom:16px}
.history-status{display:flex;align-items:center;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow)}
.history-status-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.history-status-icon.approved{background:var(--green-bg);color:var(--green)}
.history-status-icon.rejected{background:var(--red-bg);color:var(--red)}
.history-status-icon.unfilled{background:var(--gray-bg);color:var(--text-3)}
.history-status-text{font-size:15px;font-weight:600}
.history-empty{text-align:center;padding:40px 16px;color:var(--text-3);font-size:14px}

/* ===== NEW DAY DETAIL VIEW ===== */
.history-topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.back-btn{background:none;border:none;font-size:16px;color:var(--accent);cursor:pointer;padding:4px 8px}
.history-sync-status{font-size:11px;color:var(--text-3)}
.history-date-header{margin-bottom:16px}
.history-date-header h1{font-size:22px;font-weight:700}
.history-date-header p{font-size:13px;color:var(--text-3);margin-top:2px}
.history-card{background:var(--surface);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.history-card-title{font-size:14px;font-weight:600;color:var(--text-2);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.history-empty{font-size:13px;color:var(--text-3);padding:8px 0}
.history-mood-display{display:flex;align-items:center;gap:12px}
.history-mood-icon{width:40px;height:40px}
.history-mood-icon svg{width:100%;height:100%}
.history-mood-label{font-size:15px;font-weight:600;color:var(--text)}
.history-approved{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--green,#34C759)}
.approved-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--green,#34C759);color:#fff;font-size:12px}
.history-fit-row,.history-read-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
.history-label{color:var(--text-3)}
.history-value{color:var(--text);font-weight:500}
.history-read-item{justify-content:flex-start;gap:4px}
.history-link-row{margin-top:10px;text-align:center}
.history-link-btn{background:var(--border-2);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:13px;color:var(--accent);cursor:pointer;width:100%}

/* ===== SYNC INDICATOR ===== */
.sync-indicator{position:fixed;top:8px;right:8px;z-index:200;font-size:10px;color:var(--text-2);font-weight:500;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:4px 10px;border-radius:20px;border:1px solid var(--border-2);max-width:500px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);transition:background .3s;flex-shrink:0}
.sync-dot.syncing{background:var(--accent);animation:pulse 1s infinite}
.sync-dot.synced{background:var(--green)}
.sync-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ===== BELIEF CARD ===== */
.belief-card{
  background:linear-gradient(135deg,#F5F5F7 0%,#FAFAFF 100%);
  border:1px solid var(--border-2);
  border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;
  position:relative;overflow:hidden;
}
.belief-card::before{content:'"';position:absolute;top:-10px;left:8px;font-size:60px;color:var(--border);font-family:Georgia,serif;line-height:1;pointer-events:none}
.belief-text{font-size:15px;font-weight:600;line-height:1.5;color:var(--text);position:relative;z-index:1;padding-left:8px}
.belief-meta{font-size:11px;color:var(--text-3);margin-top:8px;padding-left:8px}
.belief-outdated{opacity:.5;text-decoration:line-through}
.belief-tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;background:var(--red-bg);color:var(--red);margin-left:6px;font-weight:600}
.belief-new-form{margin-top:12px}
.belief-new-form textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius-xs);padding:10px;font-size:13px;min-height:60px;outline:none}
.belief-new-form textarea:focus{border-color:var(--accent)}

/* ===== DIALOGUE ===== */
.dialogue-card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.dialogue-old{font-size:13px;color:var(--text-2);line-height:1.5;border-left:3px solid var(--border);padding-left:12px;margin-bottom:12px;white-space:pre-wrap}
.dialogue-old-date{font-size:11px;color:var(--text-3);margin-bottom:4px}
.dialogue-reply{font-size:13px;color:var(--text);line-height:1.5;border-left:3px solid var(--accent);padding-left:12px;margin-top:12px;white-space:pre-wrap}
.dialogue-reply-date{font-size:11px;color:var(--accent);margin-bottom:4px;margin-top:12px}
.dialogue-reply-form textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius-xs);padding:10px;font-size:13px;min-height:80px;outline:none;margin-top:8px}
.dialogue-reply-form textarea:focus{border-color:var(--accent)}

/* ===== CONFLICT CARDS ===== */
.conflict-form{margin-bottom:12px}
.conflict-input-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.conflict-input-row label{font-size:13px;color:var(--text-2);white-space:nowrap;flex-shrink:0}
.conflict-input-row input{flex:1;border:1px solid var(--border);border-radius:var(--radius-xs);padding:8px 10px;font-size:13px;outline:none}
.conflict-input-row input:focus{border-color:var(--accent)}
.conflict-card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);padding:14px;margin-bottom:8px}
.conflict-text{font-size:13px;line-height:1.6;color:var(--text)}
.conflict-text .c-want{color:var(--green);font-weight:600}
.conflict-text .c-but{color:var(--red);font-weight:600}
.conflict-text .c-because{color:var(--text-2)}
.conflict-date{font-size:11px;color:var(--text-3);margin-top:6px}

/* ===== LOCAL STATS ===== */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-box{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-sm);padding:14px}
.stat-box-label{font-size:11px;color:var(--text-3);margin-bottom:4px}
.stat-box-value{font-size:20px;font-weight:700;color:var(--text)}
.stat-box-sub{font-size:11px;color:var(--text-2);margin-top:2px}
.stat-correlation{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-sm);padding:14px;margin-bottom:8px}
.stat-correlation-label{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.stat-correlation-text{font-size:13px;color:var(--text);line-height:1.5}
.stat-dow-row{display:flex;gap:4px;margin-top:8px}
.stat-dow-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.stat-dow-bar-fill{width:100%;border-radius:4px 4px 0 0;min-height:4px;transition:height .3s}
.stat-dow-label{font-size:10px;color:var(--text-3)}

/* ===== MONTHLY REPORT ===== */
.monthly-report-card{background:linear-gradient(135deg,var(--surface) 0%,var(--accent-bg) 100%);border:1px solid var(--border-2);border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.monthly-report-header{font-size:16px;font-weight:700;margin-bottom:12px;color:var(--text)}
.monthly-report-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border-2)}
.monthly-report-row:last-child{border-bottom:none}
.monthly-report-label{color:var(--text-2)}
.monthly-report-value{font-weight:600;color:var(--text)}

/* ===== TASK HISTORY IN DAY VIEW ===== */
.history-task-section{margin-top:12px}
.history-task-list{list-style:none;padding:0}
.history-task-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border-2)}
.history-task-item:last-child{border-bottom:none}
.history-task-check{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.history-task-check.done{background:var(--green);border-color:var(--green)}
.history-task-check.undone{background:var(--text-3);border-color:var(--text-3)}

/* ===== GROWTH SUB-NAV ===== */
.growth-subnav{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.growth-subnav-btn{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid var(--border);background:var(--surface);color:var(--text-2);transition:all .15s}
.growth-subnav-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ===== FITNESS PLAN ===== */
.fitness-plan-card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.fitness-plan-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.fitness-plan-toggle{font-size:12px;color:var(--accent);cursor:pointer}
.fitness-day-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border-2);font-size:13px}
.fitness-day-row:last-child{border-bottom:none}
.fitness-day-label{font-weight:600;color:var(--text);width:60px;flex-shrink:0}
.fitness-day-content{color:var(--text-2)}
.fitness-day-today{background:var(--green-bg);border-radius:var(--radius-xs);padding:8px 10px}

/* ===== FITNESS PAGE ===== */
.fit-day-counter{text-align:center;padding:20px;background:linear-gradient(135deg,var(--surface) 0%,var(--accent-bg) 100%);border-radius:var(--radius);margin-bottom:12px;border:1px solid var(--border-2)}
.fit-day-number{font-size:48px;font-weight:800;color:var(--accent);letter-spacing:-.03em;line-height:1}
.fit-day-total{font-size:14px;color:var(--text-2);margin-top:4px}
.fit-day-label{font-size:13px;font-weight:600;color:var(--text);margin-top:8px}
.fit-day-progress{height:4px;background:var(--border-2);border-radius:2px;margin-top:12px;overflow:hidden}
.fit-day-progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.fit-template-label{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.fit-exercise-row{padding:10px 0;border-bottom:1px solid var(--border-2)}
.fit-exercise-row:last-child{border-bottom:none}
.fit-exercise-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.fit-exercise-name{font-size:14px;font-weight:600;color:var(--text)}
.fit-exercise-target{font-size:11px;color:var(--text-3)}

function getDailyQuote(){
  var today=getTodayISO();
  var hash=0;
  for(var i=0;i<today.length;i++){hash=((hash<<5)-hash+today.charCodeAt(i))|0}
  var idx=Math.abs(hash)%DAILY_QUOTES.length;
  return DAILY_QUOTES[idx];
}
var FITNESS_START='2026-09-01';

/* ===== READING / BOOK ===== */
function getBookById(id){
  if(!state.readingBooks)return null;
  for(var i=0;i<state.readingBooks.length;i++){
    if(state.readingBooks[i].id===id)return state.readingBooks[i];
  }
  return null;
}
function getBookProgress(book){
  if(!book||!book.totalPages||!book.currentPage)return 0;
  return Math.min(100,Math.round(book.currentPage/book.totalPages*100));
}
function getBookDaysLeft(book){
  if(!book||!book.deadline)return null;
  var today=new Date(getTodayISO()+'T00:00:00');
  var ddl=new Date(book.deadline+'T00:00:00');
  return Math.ceil((ddl-today)/86400000);
}
function getBookExpectedPage(book){
  if(!book||!book.totalPages||!book.deadline)return null;
  var start=book.startDate||getTodayISO();
  var today=new Date(getTodayISO()+'T00:00:00');
  var startDate=new Date(start+'T00:00:00');
  var ddl=new Date(book.deadline+'T00:00:00');
  var totalDays=Math.max(1,Math.ceil((ddl-startDate)/86400000));
  var daysPassed=Math.max(0,Math.ceil((today-startDate)/86400000));
  return Math.round(book.totalPages*daysPassed/totalDays);
}
function isBookBehind(book){
  if(!book||book.status==='finished')return false;
  var expected=getBookExpectedPage(book);
  if(expected===null)return false;
  return book.currentPage<expected*0.9;
}
function getMostBehindBook(){
  if(!state.readingBooks||state.readingBooks.length===0)return null;
  var behind=null;var maxGap=0;
  for(var i=0;i<state.readingBooks.length;i++){
    var b=state.readingBooks[i];
    if(b.status==='finished')continue;
    var expected=getBookExpectedPage(b);
    if(expected===null)continue;
    var gap=expected-b.currentPage;
    if(gap>maxGap){maxGap=gap;behind=b}
  }
  return behind?{book:behind,gap:maxGap}:null;
}
function addBook(data){
  if(!state.readingBooks)state.readingBooks=[];
  state.readingBooks.unshift({
    id:uid(),
    title:data.title||'未命名书籍',
    totalPages:parseInt(data.totalPages)||0,
    currentPage:parseInt(data.currentPage)||0,
    deadline:data.deadline||'',
    dailyGoal:parseInt(data.dailyGoal)||0,
    startDate:data.startDate||getTodayISO(),
    status:'reading',
    note:'',
    history:[]
  });
  saveState();render();
}
function updateBookProgress(id,page,note){
  var book=getBookById(id);
  if(!book)return;
  var p=parseInt(page);
  if(isNaN(p))p=book.currentPage;
  if(p>book.totalPages)p=book.totalPages;
  if(p<0)p=0;
  var today=getTodayISO();
  var hasToday=false;
  if(book.history){
    for(var i=0;i<book.history.length;i++){
      if(book.history[i].date===today){book.history[i].page=p;hasToday=true;break}
    }
  }else{book.history=[]}
  if(!hasToday&&p!==book.currentPage){
    book.history.unshift({date:today,page:p,note:note||''});
  }else if(note){
    for(var j=0;j<book.history.length;j++){
      if(book.history[j].date===today){book.history[j].note=note;break}
    }
  }
  book.currentPage=p;
  if(p>=book.totalPages&&book.totalPages>0)book.status='finished';
  saveState();render();
}
function deleteBook(id){
  if(!state.readingBooks)return;
  state.readingBooks=state.readingBooks.filter(function(b){return b.id!==id});
  state.bookView='list';state.bookDetailId=null;
  saveState();render();
}
function submitBook(){
  var title=document.querySelector('[data-input="add-book-title"]').value.trim();
  var pages=parseInt(document.querySelector('[data-input="add-book-pages"]').value)||0;
  var current=parseInt(document.querySelector('[data-input="add-book-current"]').value)||0;
  var deadline=document.querySelector('[data-input="add-book-deadline"]').value;
  var goal=parseInt(document.querySelector('[data-input="add-book-goal"]').value)||0;
  if(!title){alert('请输入书名');return}
  if(pages<=0){alert('请输入总页数');return}
  addBook({title:title,totalPages:pages,currentPage:current,deadline:deadline,dailyGoal:goal});
  state.bookView='list';saveState();render();
}
function saveBookProgress(id){
  var pageEl=document.querySelector('[data-input="book-current-page"][data-value="'+id+'"]');
  var noteEl=document.querySelector('[data-input="book-today-note"][data-value="'+id+'"]');
  var page=pageEl?pageEl.value:'';
  var note=noteEl?noteEl.value:'';
  updateBookProgress(id,page,note);
}
function quickUpdatePage(bookId,page){
  updateBookProgress(bookId,page,'');
  render();
}

function submitArticle(){
  var title=ds_val('add-article-title-en');
  var source=ds_val('add-article-source');
  var difficulty=ds_val('add-article-difficulty');
  var topic=ds_val('add-article-topic');
  var content=ds_val('add-article-content');
  if(!title&&!content){state.articleView='list';saveState();render();return}
  var blocks=content.split(/\n\n+/).filter(function(b){return b.trim()});
  var enParas=[],zhParas=[];
  for(var i=0;i<blocks.length;i++){
    var lines=blocks[i].split(/\n/).filter(function(l){return l.trim()});
    if(lines.length>=2){
      enParas.push(lines[0].trim());
      zhParas.push(lines[1].trim());
    }else if(lines.length===1){
      if(/[\u4e00-\u9fa5]/.test(lines[0])){
        zhParas.push(lines[0].trim());
        enParas.push('');
      }else{
        enParas.push(lines[0].trim());
        zhParas.push('');
      }
    }
  }
  var article={
    id:uid(),
    titleEn:title,
    titleZh:title,
    source:source||'',
    publishDate:getTodayISO(),
    contentEn:enParas,
    contentZh:zhParas,
    difficulty:difficulty||'medium',
    topic:topic||'',
    addedDate:getTodayISO(),
    read:true,
    favorite:false
  };
  state.articles.unshift(article);
  if(!state.articleCheckins)state.articleCheckins={};
  state.articleCheckins[getTodayISO()]={date:getTodayISO(),completed:true};
  state.articleView='list';
  saveState();render();
}

function isWeekend(d){return d.getDay()===0||d.getDay()===6}

function getTodayISO(){return formatDateISO(new Date())}

function getApproval(dateISO){
  if(state.dailyApproval[dateISO]===true)return'approved';
  if(state.dailyApproval[dateISO]===false)return'rejected';
  return'unfilled';
}

function getStreak(){
  var today=new Date();
  var todayApproval=getApproval(formatDateISO(today));
  if(todayApproval==='rejected')return 0;
  var streak=0;
  if(todayApproval==='approved')streak=1;
  var d=new Date(today);d.setDate(d.getDate()-1);
  while(getApproval(formatDateISO(d))==='approved'){streak++;d.setDate(d.getDate()-1)}
  return streak;
}
function getBestStreak(){
  var dates=[];
  for(var ds in state.dailyApproval){if(state.dailyApproval[ds]===true)dates.push(ds)}
  dates.sort();
  if(dates.length===0)return 0;
  var best=1,current=1;
  for(var i=1;i<dates.length;i++){
    var prev=new Date(dates[i-1]+'T00:00:00');var curr=new Date(dates[i]+'T00:00:00');
    var diff=Math.round((curr-prev)/86400000);
    if(diff===1){current++;if(current>best)best=current}else{current=1}
  }
  var curStreak=getStreak();
  return Math.max(best,curStreak);
}
function getMonthlyApprovedCount(){
  var today=new Date();var y=today.getFullYear(),m=today.getMonth();
  var daysInMonth=new Date(y,m+1,0).getDate();var approved=0;
  for(var ds in state.dailyApproval){
    var parts=ds.split('-');
    if(parseInt(parts[0])===y&&parseInt(parts[1])-1===m&&state.dailyApproval[ds]===true)approved++;
  }
  return approved+'/'+daysInMonth;
}

/* ===== MONTHLY REPORT ===== */
function checkMonthlyReport(){
  var today=new Date();
  var y=today.getFullYear(),m=today.getMonth();
  var monthKey=y+'-'+String(m+1).padStart(2,'0');
  if(!state.monthlyReports)state.monthlyReports=[];
  for(var i=0;i<state.monthlyReports.length;i++){
    if(state.monthlyReports[i].month===monthKey)return;
  }
  var isLastDay=today.getDate()===new Date(y,m+1,0).getDate();
  if(!isLastDay)return;
  var daysInMonth=new Date(y,m+1,0).getDate();
  var approved=0,rejected=0;
  var energySum=0,energyCount=0;
  for(var ds in state.dailyApproval){
    var parts=ds.split('-');
    if(parseInt(parts[0])===y&&parseInt(parts[1])-1===m){
      if(state.dailyApproval[ds]===true)approved++;
      else if(state.dailyApproval[ds]===false)rejected++;
    }
  }
  for(var ds2 in state.energyHistory){
    var parts2=ds2.split('-');
    if(parseInt(parts2[0])===y&&parseInt(parts2[1])-1===m){
      var e=state.energyHistory[ds2];
      energySum+=(e.energy+e.focus+e.mood)/3;
      energyCount++;
    }
  }
  var opinionCount=0;
  for(var ds3 in state.opinionHistory){
    var parts3=ds3.split('-');
    if(parseInt(parts3[0])===y&&parseInt(parts3[1])-1===m&&state.opinionHistory[ds3].trim())opinionCount++;
  }
  var outputCount=0;
  for(var i2=0;i2<state.outputs.length;i2++){
    if(state.outputs[i2].date&&state.outputs[i2].date.substring(0,7)===monthKey)outputCount++;
  }
  var fitDays=0,fitGood=0,fitAvg=0,fitPoor=0;
  var bodyFatFirst=null,bodyFatLast=null;
  for(var ds4 in state.fitnessLogs){
    var parts4=ds4.split('-');
    if(parseInt(parts4[0])===y&&parseInt(parts4[1])-1===m){
      var fl=state.fitnessLogs[ds4];
      if(fl.completed)fitDays++;
      if(fl.status==='good')fitGood++;
      else if(fl.status==='average')fitAvg++;
      else if(fl.status==='poor')fitPoor++;
      if(fl.bodyFat){
        if(bodyFatFirst===null)bodyFatFirst=fl.bodyFat;
        bodyFatLast=fl.bodyFat;
      }
    }
  }
  var streak=getStreak();
  var bestStreak=getBestStreak();
  state.monthlyReports.push({
    month:monthKey,
    approved:approved,
    rejected:rejected,
    unrecorded:daysInMonth-approved-rejected,
    avgEnergy:energyCount>0?Math.round(energySum/energyCount*10)/10:0,
    opinions:opinionCount,
    outputs:outputCount,
    streak:streak,
    bestStreak:bestStreak,
    fitDays:fitDays,
    fitGood:fitGood,
    fitAvg:fitAvg,
    fitPoor:fitPoor,
    bodyFatChange:(bodyFatFirst!==null&&bodyFatLast!==null)?Math.round((bodyFatLast-bodyFatFirst)*10)/10:null
  });
  saveState();
}

/* ===== LOCAL STATS ===== */
function getLocalStats(){
  var stats={correlations:[],dowEnergy:{},dowApproval:{}};
  var dowNames=['周日','周一','周二','周三','周四','周五','周六'];
  for(var i=0;i<7;i++){stats.dowEnergy[i]={sum:0,count:0,avg:0};stats.dowApproval[i]={approved:0,total:0}}
  var energyVals=[];
  var moodVals=[];
  for(var ds in state.energyHistory){
    var e=state.energyHistory[ds];
    var d=new Date(ds+'T00:00:00');
    var dow=d.getDay();
    stats.dowEnergy[dow].sum+=(e.energy+e.focus+e.mood)/3;
    stats.dowEnergy[dow].count++;
    energyVals.push(e.energy);
    moodVals.push(e.mood);
  }
  for(var dow in stats.dowEnergy){
    var de=stats.dowEnergy[dow];
    de.avg=de.count>0?Math.round(de.sum/de.count*10)/10:0;
  }
  for(var ds2 in state.dailyApproval){
    var d2=new Date(ds2+'T00:00:00');
    var dow2=d2.getDay();
    stats.dowApproval[dow2].total++;
    if(state.dailyApproval[ds2]===true)stats.dowApproval[dow2].approved++;
  }
  if(energyVals.length>=3){
    var eSum=0,mSum=0,eSq=0,mSq=0,emSum=0,n=energyVals.length;
    for(var i2=0;i2<n;i2++){eSum+=energyVals[i2];mSum+=moodVals[i2];eSq+=energyVals[i2]*energyVals[i2];mSq+=moodVals[i2]*moodVals[i2];emSum+=energyVals[i2]*moodVals[i2]}
    var eAvg=eSum/n,mAvg=mSum/n;
    var cov=emSum/n-eAvg*mAvg;
    var eVar=eSq/n-eAvg*eAvg;
    if(Math.abs(eVar)>0.001){
      var corr=cov/Math.sqrt(eVar*(mSq/n-mAvg*mAvg));
      if(corr>0.5)stats.correlations.push('能量与心情强正相关（r='+corr.toFixed(2)+'）：能量高时心情通常也好');
      else if(corr<-0.5)stats.correlations.push('能量与心情负相关（r='+corr.toFixed(2)+'）：能量高时心情反而偏低');
      else stats.correlations.push('能量与心情相关性弱（r='+corr.toFixed(2)+'）：两者关联不大');
    }
  }
  var bestDow=-1,bestAvg=0;
  for(var dow2=0;dow2<7;dow2++){
    if(stats.dowEnergy[dow2].count>0&&stats.dowEnergy[dow2].avg>bestAvg){bestAvg=stats.dowEnergy[dow2].avg;bestDow=dow2}
  }
  if(bestDow>=0)stats.correlations.push(dowNames[bestDow]+'状态最好（平均'+bestAvg+'分）');
  var worstDow=-1,worstAvg=99;
  for(var dow3=0;dow3<7;dow3++){
    if(stats.dowEnergy[dow3].count>0&&stats.dowEnergy[dow3].avg<worstAvg){worstAvg=stats.dowEnergy[dow3].avg;worstDow=dow3}
  }
  if(worstDow>=0&&worstDow!==bestDow)stats.correlations.push(dowNames[worstDow]+'状态最低（平均'+worstAvg+'分）');
  var approvedLow=0,approvedHigh=0;
  for(var ds3 in state.energyHistory){
    var e3=state.energyHistory[ds3];
    var avgE=(e3.energy+e3.focus+e3.mood)/3;
    var ap=state.dailyApproval[ds3];
    if(ap===true){if(avgE<=3)approvedLow++;else approvedHigh++}
  }
  if((approvedLow+approvedHigh)>=3){
    if(approvedHigh>approvedLow)stats.correlations.push('能量高时更容易对自己满意（高能量满意'+approvedHigh+'次 vs 低能量满意'+approvedLow+'次）');
    else if(approvedLow>approvedHigh)stats.correlations.push('低能量时反而更常满意（可能标准更低？）');
  }
  return stats;
}

function renderCalendar(){
  var y=state.calendarYear,m=state.calendarMonth;
  var monthNames=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  var firstDay=new Date(y,m,1);var lastDay=new Date(y,m+1,0);
  var startWeekday=firstDay.getDay();var daysInMonth=lastDay.getDate();
  var todayISO=getTodayISO();

  for(var i=0;i<7;i++)html+='<div class="calendar-dow'+(i===0||i===6?' weekend':'')+'">'+dows[i]+'</div>';
  for(var i=0;i<startWeekday;i++)html+='<div class="cal-day other-month"></div>';
  for(var day=1;day<=daysInMonth;day++){
    var d=new Date(y,m,day);var ds=formatDateISO(d);

    var log=state.fitnessLogs[ds];

    var hasRead=(state.articleCheckins&&state.articleCheckins[ds])||false;
    if(!hasRead&&state.readingBooks){
      for(var b=0;b<state.readingBooks.length;b++){

function renderMemo(){
  var search=state.memoSearch||'';
  var filter=state.memoFilter||'all';
  var html='<div class="memo-search-bar"><input type="text" class="memo-search-input" data-input="memo-search" placeholder="搜索备忘录..." value="'+search+'" /></div>';
  html+='<div class="memo-filters"><button class="memo-filter'+(filter==='all'?' active':'')+'" data-action="filter-memo" data-value="all">全部</button><button class="memo-filter'+(filter==='opinion'?' active':'')+'" data-action="filter-memo" data-value="opinion">观点</button><button class="memo-filter'+(filter==='top3'?' active':'')+'" data-action="filter-memo" data-value="top3">Top 3</button></div>';
  var entries=[];
  var opinionHist=state.opinionHistory||{};
  for(var ds in opinionHist){
    var text=opinionHist[ds];
    if(text&&text.trim())entries.push({date:ds,text:text.trim(),type:'opinion'});
    var extras=state.opinionExtras&&state.opinionExtras[ds]?state.opinionExtras[ds]:[];
    for(var ei=0;ei<extras.length;ei++){
      if(extras[ei].text&&extras[ei].text.trim())entries.push({date:ds,text:extras[ei].text.trim(),type:'opinion',subtag:'补充'});
    }
  }
  var top3Arch=state.top3Archive||[];
  for(var i=0;i<top3Arch.length;i++){
    var e=top3Arch[i];
    if(e.content&&e.content.trim())entries.push({date:e.date,text:e.content.trim(),type:'top3'});
  }
  if(filter!=='all')entries=entries.filter(function(e){return e.type===filter});
  if(search.trim()){
    var q=search.trim().toLowerCase();
    entries=entries.filter(function(e){return e.text.toLowerCase().indexOf(q)>=0});
  }
  entries.sort(function(a,b){return b.date.localeCompare(a.date)});
  if(entries.length===0){
    html+='<div class="history-empty">没有匹配的记录</div>';
  }else{
    for(var i=0;i<entries.length;i++){
      var e=entries[i];
      var d=new Date(e.date+'T00:00:00');
      var dayNames=['日','一','二','三','四','五','六'];
      var dateStr=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 周'+dayNames[d.getDay()];
      var tag=e.type==='top3'?'<span class="memo-tag">Top 3</span> ':'';
      var subtag=e.subtag?'<span class="memo-tag" style="background:var(--accent-bg);color:var(--accent)">'+e.subtag+'</span> ':'';
      html+='<div class="memo-card"><div class="memo-date">'+tag+subtag+dateStr+'</div><div class="memo-content">'+e.text+'</div></div>';
    }
  }
  return html;
}

/* ===== RENDER: FIT ===== */
function getFitnessDay(){
  var start=new Date(FITNESS_START+'T00:00:00');
  var today=new Date(getTodayISO()+'T00:00:00');
  var diff=Math.round((today-start)/(86400000))+1;
  return diff<1?1:(diff>30?30:diff);
}
function getTodayTemplate(){
  var day=getFitnessDay();
  return getDayTemplate(day);
}
function getDayTemplate(day){
  var key=state.fitOverrides&&state.fitOverrides[day]?state.fitOverrides[day]:FITNESS_DAY_MAP[day];
  return FITNESS_TEMPLATES[key];
}
function getDayTemplateKey(day){
  return state.fitOverrides&&state.fitOverrides[day]?state.fitOverrides[day]:FITNESS_DAY_MAP[day];
}
function getFitLog(date){
  var ds=date||getTodayISO();
  if(!state.fitnessLogs[ds])state.fitnessLogs[ds]={exercises:{},waist:0};
  var log=state.fitnessLogs[ds];
  if(!log.exercises)log.exercises={};
  if(log.waist===undefined)log.waist=0;
  return log;
}
function get7DayAvgWeight(){
  var weights=[];
  for(var i=0;i<7;i++){
    var d=new Date();d.setDate(d.getDate()-i);
    var ds=formatDateISO(d);
    var log=state.fitnessLogs[ds];
    if(log&&log.weight)weights.push(log.weight);
  }
  if(weights.length===0)return null;
  var sum=0;for(var i=0;i<weights.length;i++)sum+=weights[i];
  return Math.round(sum/weights.length*10)/10;
}

function renderFitCalendar(){

  if(state.fitCalendarMonth){

    y=now.getFullYear();

  }

  var firstDay=new Date(y,m,1);
  var lastDay=new Date(y,m+1,0);
  var startWeekday=firstDay.getDay();
  var daysInMonth=lastDay.getDate();
  var todayISO=getTodayISO();
  var startDate=new Date(FITNESS_START+'T00:00:00');

  var html='<div class="card"><div class="section-header">\u6708\u5386 \u00b7 Calendar</div>';
  html+='<div class="calendar-nav"><button class="calendar-nav-btn" data-action="prev-fit-month">\u2039</button><span class="calendar-title">'+y+'\u5e74 '+monthNames[m]+'</span><button class="calendar-nav-btn" data-action="next-fit-month">\u203a</button></div>';
  html+='<div class="calendar-grid">';
  var dows=['\u65e5','\u4e00','\u4e8c','\u4e09','\u56db','\u4e94','\u516d'];
  for(var i=0;i<7;i++)html+='<div class="calendar-dow'+(i===0||i===6?' weekend':'')+'">'+dows[i]+'</div>';
  for(var i=0;i<startWeekday;i++)html+='<div class="fit-cal-day" style="visibility:hidden"></div>';
  for(var day=1;day<=daysInMonth;day++){
    var d=new Date(y,m,day);
    var ds=formatDateISO(d);
    var isToday=ds===todayISO;
    var dayNum=Math.round((d-startDate)/86400000)+1;
    var inPlan=dayNum>=1&&dayNum<=30;
    var isCurrentDay=dayNum===currentFitDay;
    var log=state.fitnessLogs[ds];
    var tpl=inPlan?getDayTemplate(dayNum):null;
    var isRestDay=tpl&&tpl.restNote&&(!tpl.exercises||tpl.exercises.length===0);
    var completed=log&&log.completed;
    var statusColor=log&&log.status?{good:'#34C759',average:'#FF9F0A',poor:'#FF3B30'}[log.status]:'';
    var cls='fit-cal-day';

    if(isRestDay)cls+=' rest-day';

    var cellInner='<span class="fit-cal-day-num">'+day+'</span>';

      if(completed){
        cellInner+='<svg viewBox="0 0 24 24" style="width:18px;height:18px;position:absolute;top:50%;left:50%;transform:translate(-50%,-55%)"><path d="M4 14l6 6L20 6" stroke="var(--green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';
      }else if(isRestDay){
        cellInner+='<span style="position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--text-3);white-space:nowrap;line-height:1">\u4f11\u606f</span>';
      }
      if(statusColor){
        cellInner+='<span style="position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:'+statusColor+';display:inline-block"></span>';
      }
    }
    var actionAttr=inPlan?' data-action="view-fit-day" data-day="'+dayNum+'"':'';
    html+='<div class="'+cls+'"'+actionAttr+'>'+cellInner+'</div>';
  }
  html+='</div>';
  html+='<div class="fit-cal-legend">';
  html+='<span><span class="fit-cal-legend-dot" style="background:#34C759"></span>\u72b6\u6001\u597d</span>';
  html+='<span><span class="fit-cal-legend-dot" style="background:#FF9F0A"></span>\u4e00\u822c</span>';
  html+='<span><span class="fit-cal-legend-dot" style="background:#FF3B30"></span>\u72b6\u6001\u5dee</span>';
  html+='<span>\u2713 \u5df2\u5b8c\u6210</span>';
  html+='<span>\u4f11\u606f \u4f11\u606f\u65e5</span>';

  html+='</div>';

function renderFitChart(){
  var range=state.fitChartRange||'week';
  var html='<div class="fit-chart-card"><div class="section-header">体脂率变化</div>';
  html+='<div class="output-filters"><button class="output-filter'+(range==='week'?' active':'')+'" data-action="fit-chart-range" data-value="week">本周</button><button class="output-filter'+(range==='month'?' active':'')+'" data-action="fit-chart-range" data-value="month">本月</button></div>';
  var days=range==='week'?7:30;
  var data=[];
  for(var i=days-1;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);
    var ds=formatDateISO(d);
    var log=state.fitnessLogs[ds];
    if(log&&log.bodyFat)data.push({date:ds,value:log.bodyFat});
  }
  if(data.length<2){
    var w=300,h=140,padL=30,padR=10,padT=10,padB=24;
    var chartW=w-padL-padR,chartH=h-padT-padB;
    html+='<svg class="fit-chart-svg" viewBox="0 0 '+w+' '+h+'">';
    html+='<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+chartH)+'" stroke="var(--border)" stroke-width="1"/>';
    html+='<line x1="'+padL+'" y1="'+(padT+chartH)+'" x2="'+(padL+chartW)+'" y2="'+(padT+chartH)+'" stroke="var(--border)" stroke-width="1"/>';
    for(var gi=0;gi<=5;gi++){
      var gy=padT+chartH-(gi/5)*chartH;
      var gv=(15+gi*2);
      html+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(padL+chartW)+'" y2="'+gy+'" stroke="var(--border-2)" stroke-width="0.5" stroke-dasharray="2,3"/>';
      html+='<text x="'+(padL-4)+'" y="'+(gy+3)+'" text-anchor="end" font-size="8" fill="var(--text-3)">'+gv+'%</text>';
    }
    var todayLbl=new Date();
    for(var di=0;di<days;di++){
      var dd=new Date();dd.setDate(dd.getDate()-(days-1-di));
      var dx=padL+(days===1?chartW/2:chartW*di/(days-1));
      var dlbl=(dd.getMonth()+1)+'/'+dd.getDate();
      if(days<=7||di%Math.ceil(days/6)===0||di===days-1){
        html+='<text x="'+dx+'" y="'+(h-6)+'" text-anchor="middle" font-size="8" fill="var(--text-3)">'+dlbl+'</text>';
      }
    }
    if(data.length===1){
      var single=data[0];
      var sx=padL+chartW/2;
      var sy=padT+chartH-(single.value-15)/12*chartH;
      html+='<circle cx="'+sx+'" cy="'+sy+'" r="4" fill="var(--accent)"/>';
      html+='<text x="'+sx+'" y="'+(sy-8)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--accent)">'+single.value+'%</text>';
    }
    html+='</svg>';
    if(data.length===0)html+='<p style="text-align:center;font-size:12px;color:var(--text-3);padding:8px 0">暂无体脂数据，填写后自动生成折线</p>';
    html+='</div>';
  }else{
  var minV=Math.min.apply(null,data.map(function(d){return d.value}))-1;
  var maxV=Math.max.apply(null,data.map(function(d){return d.value}))+1;
  var rangeV=maxV-minV||1;
  var w=300,h=140,padL=30,padR=10,padT=10,padB=24;
  var chartW=w-padL-padR,chartH=h-padT-padB;
  var pts='';
  var dots='';
  var labels='';
  for(var j=0;j<data.length;j++){
    var x=padL+(data.length===1?chartW/2:chartW*j/(data.length-1));
    var y=padT+chartH-(data[j].value-minV)/rangeV*chartH;
    pts+=(j===0?'':' ')+' '+x+','+y;
    dots+='<circle cx="'+x+'" cy="'+y+'" r="3" fill="var(--accent)"/>';
    if(j===0||j===data.length-1||data.length<=7){

function renderHistory(){

function renderDayDetail(dateStr){
  var d=new Date(dateStr+'T00:00:00');
  var dow=['日','一','二','三','四','五','六'][d.getDay()];
  var isWeekend=(d.getDay()===0||d.getDay()===6);
  var html='';
  /* Top bar with back button */
  html+='<div class="history-topbar"><button class="back-btn" data-action="back-from-history">\u2190 返回</button>';
  var syncStatus=state.lastSync?(new Date(state.lastSync).toLocaleDateString()===new Date().toLocaleDateString()?'已同步':'未同步'):'未同步';
  html+='<span class="history-sync-status">'+syncStatus+'</span></div>';
  /* Date header */
  html+='<div class="history-date-header">';
  html+='<h1>'+(d.getMonth()+1)+'月'+d.getDate()+'日 周'+dow+'</h1>';
  if(isWeekend)html+='<p>周末</p>';
  html+='</div>';
  /* 1. Mood Weather */
  var mood=state.moodWeather&&state.moodWeather[dateStr];
  html+='<div class="history-card">';
  html+='<div class="history-card-title">心情晴雨表</div>';
  if(mood){
    var moodOpt=null;
    for(var i=0;i<MOOD_WEATHER_OPTIONS.length;i++){
      if(MOOD_WEATHER_OPTIONS[i].value===mood){moodOpt=MOOD_WEATHER_OPTIONS[i];break}
    }
    if(moodOpt){
      html+='<div class="history-mood-display">';
      html+='<div class="history-mood-icon">'+moodOpt.svg+'</div>';
      html+='<div class="history-mood-label">'+moodOpt.label+'</div>';
      html+='</div>';
    }
  }else{
    html+='<div class="history-empty">未记录</div>';
  }
  html+='</div>';
  /* 2. Approval / Satisfaction */
  var isApproved=state.dailyApproval&&state.dailyApproval[dateStr]===true;
  html+='<div class="history-card">';
  html+='<div class="history-card-title">满意度</div>';
  if(isApproved){
    html+='<div class="history-approved"><span class="approved-badge">\u2713</span> 满意 \u00b7 Approved</div>';
  }else{
    html+='<div class="history-empty">未记录</div>';
  }
  html+='</div>';
  /* 3. Fitness Data */
  var fitLog=state.fitnessLogs&&state.fitnessLogs[dateStr];
  var hasFitData=fitLog&&(fitLog.completed||fitLog.weight||fitLog.bodyFat||fitLog.muscle||fitLog.waist);
  html+='<div class="history-card">';
  html+='<div class="history-card-title">健身</div>';
  if(hasFitData){
    if(fitLog.completed){
      var statusMap={good:'\u{1F7E2} 状态好',average:'\u{1F7E1} 一般',poor:'\u{1F534} 较差'};
      html+='<div class="history-fit-row"><span class="history-label">训练完成</span><span class="history-value">\u2713 已完成'+(fitLog.status?' \u00b7 '+statusMap[fitLog.status]:'')+'</span></div>';
    }
    if(fitLog.weight)html+='<div class="history-fit-row"><span class="history-label">体重</span><span class="history-value">'+fitLog.weight+' kg</span></div>';
    if(fitLog.bodyFat)html+='<div class="history-fit-row"><span class="history-label">体脂率</span><span class="history-value">'+fitLog.bodyFat+'%</span></div>';
    if(fitLog.muscle)html+='<div class="history-fit-row"><span class="history-label">骨骼肌</span><span class="history-value">'+fitLog.muscle+' kg</span></div>';
    if(fitLog.waist)html+='<div class="history-fit-row"><span class="history-label">腰围</span><span class="history-value">'+fitLog.waist+' cm</span></div>';
    html+='<div class="history-link-row"><button class="history-link-btn" data-action="go-fit">查看训练详情 \u2192</button></div>';
  }else{
    html+='<div class="history-empty">无训练记录</div>';
  }
  html+='</div>';
  /* 4. Reading Status */
  var hasReadLog=false;
  var readDetail='';
  /* Check article reading log - articleLogs is keyed by date, each date has article IDs */
  if(state.articleLogs&&state.articleLogs[dateStr]){
    for(var aid in state.articleLogs[dateStr]){
      var artLog=state.articleLogs[dateStr][aid];
      if(artLog&&artLog.completed){
        hasReadLog=true;
        var article=null;
        if(state.articles){
          for(var aj=0;aj<state.articles.length;aj++){
            if(state.articles[aj].id===aid){article=state.articles[aj];break}
          }
        }
        readDetail+='<div class="history-read-item">\u{1F4F0} '+(article?article.titleEn||article.titleZh:'外刊')+'</div>';
      }
    }
  }
  /* Check book reading log */
  if(state.readingBooks){
    for(var bi=0;bi<state.readingBooks.length;bi++){
      var book=state.readingBooks[bi];
      if(book.history){
        for(var hi=0;hi<book.history.length;hi++){
          if(book.history[hi].date===dateStr){
            hasReadLog=true;
            readDetail+='<div class="history-read-item">\u{1F4D6} '+book.title;
            if(book.history[hi].page)readDetail+=' \u00b7 第'+book.history[hi].page+'页';
            if(book.history[hi].note)readDetail+=' \u00b7 '+book.history[hi].note;
            readDetail+='</div>';
          }
        }
      }
    }
  }
  html+='<div class="history-card">';
  html+='<div class="history-card-title">阅读</div>';
  if(hasReadLog){
    html+=readDetail;
    html+='<div class="history-link-row"><button class="history-link-btn" data-action="go-read">查看阅读详情 \u2192</button></div>';
  }else{
    html+='<div class="history-empty">无阅读记录</div>';
  }
  html+='</div>';
  return html;
}

/* ===== ACTIONS ===== */
function navigate(page){state.currentPage=page;saveState();render();window.scrollTo(0,0)}
function toggleTask(type,id){var tasks=state.tasks[type];for(var i=0;i<tasks.length;i++){if(tasks[i].id===id){tasks[i].completed=!tasks[i].completed;break}}saveState();render()}
function deleteTask(type,id){var tasks=state.tasks[type];for(var i=0;i<tasks.length;i++){if(tasks[i].id===id){tasks.splice(i,1);break}}saveState();render()}
function editTask(type,id){state.editingTaskId=id;render();requestAnimationFrame(function(){var inp=document.querySelector('.task-edit-input');if(inp)inp.focus()})}
function cancelTaskEdit(){state.editingTaskId=null;render()}
function saveTaskEdit(type,id){
  var inp=document.querySelector('.task-edit-input[data-id="'+id+'"]');
  if(!inp){state.editingTaskId=null;render();return}
  var val=inp.value.trim();
  if(val){var tasks=state.tasks[type];for(var i=0;i<tasks.length;i++){if(tasks[i].id===id){tasks[i].title=val;break}}}
  state.editingTaskId=null;saveState();render();
}
function filterMemo(val){state.memoFilter=val;saveState();render()}
function openAddForm(type,category){state.addForm={type:type,category:category,priority:'should',title:''};render();requestAnimationFrame(function(){var inp=document.querySelector('.add-task-input');if(inp)inp.focus()})}
function closeAddForm(){state.addForm={type:null,category:null,priority:'should',title:''};render()}
function selectPriority(val){state.addForm.priority=val;render();requestAnimationFrame(function(){var inp=document.querySelector('.add-task-input');if(inp){inp.focus();var len=inp.value.length;inp.setSelectionRange(len,len)}})}
function selectPreset(val){state.addForm.title=val;render();requestAnimationFrame(function(){var inp=document.querySelector('.add-task-input');if(inp){inp.focus();var len=inp.value.length;inp.setSelectionRange(len,len)}})}
function addTaskFromForm(){
  var f=state.addForm;if(!f.title||!f.title.trim())return;
  var tasks=state.tasks[f.type];
  tasks.push({id:uid(),category:f.category,title:f.title.trim(),priority:f.priority,completed:false});
  state.addForm={type:null,category:null,priority:'should',title:''};
  saveState();render();
}
function toggleRecovery(){state.recoveryMode=!state.recoveryMode;saveState();render()}
function setEnergy(type,val){state.energy[type]=val;saveDailyEnergy();saveState();render()}
function setApproval(val){
  var today=getTodayISO();
  if(state.dailyApproval[today]===val){delete state.dailyApproval[today]}else{state.dailyApproval[today]=val}
  saveState();render();
}
function setMoodWeather(value){
  var today=getTodayISO();
  if(state.moodWeather[today]===value){
    delete state.moodWeather[today];
  }else{
    state.moodWeather[today]=value;
  }
  saveState();render();
}
function switchReviewTab(val){state.reviewTab=val;saveState();render()}
function filterOutput(val){state.outputFilter=val;saveState();render()}
function openAddOutput(){state.addOutputOpen=true;state.newOutput={type:'工作',title:'',desc:''};render();requestAnimationFrame(function(){var s=document.querySelector('.output-type-select');if(s)s.focus()})}
function closeAddOutput(){state.addOutputOpen=false;render()}
function addOutput(){
  var n=state.newOutput;if(!n.title||!n.title.trim())return;
  state.outputs.unshift({id:uid(),type:n.type,title:n.title.trim(),desc:n.desc||'',date:formatDateISO(new Date())});
  state.addOutputOpen=false;state.newOutput={type:'工作',title:'',desc:''};
  saveState();render();
}
function navigateMonth(delta){
  state.calendarMonth+=delta;
  if(state.calendarMonth<0){state.calendarMonth=11;state.calendarYear--}
  if(state.calendarMonth>11){state.calendarMonth=0;state.calendarYear++}
  saveState();render();
}
function navigateFitMonth(delta){
  var now=new Date();
  var y,m;
  if(state.fitCalendarMonth){
    y=state.fitCalendarMonth.year;
    m=state.fitCalendarMonth.month+delta;
  }else{
    y=now.getFullYear();
    m=now.getMonth()+delta;
  }
  if(m<0){m=11;y--}
  if(m>11){m=0;y++}
  state.fitCalendarMonth={year:y,month:m};
  saveState();render();
}
function viewHistoryDay(dateISO){state.historyDate=dateISO;state.currentPage='history';saveState();render();window.scrollTo(0,0)}
function backFromHistory(){state.currentPage='review';saveState();render();window.scrollTo(0,0)}
function setGrowthView(val){state.growthView=val;saveState();render()}
function addBelief(){
  var text=(state.beliefDraft||'').trim();if(!text)return;
  state.beliefs.push({id:uid(),text:text,date:getTodayISO(),outdated:false});
  state.beliefDraft='';saveState();render();
}
function toggleBeliefOutdated(id){
  for(var i=0;i<state.beliefs.length;i++){
    if(state.beliefs[i].id===id){state.beliefs[i].outdated=!state.beliefs[i].outdated;break}
  }
  saveState();render();
}
function startDialogue(){
  var entries=[];
  var oh=state.opinionHistory||{};
  for(var ds in oh){
    var text=oh[ds];
    if(text&&text.trim()&&ds!==getTodayISO())entries.push({date:ds,text:text.trim()});
  }
  var ta=state.top3Archive||[];
  for(var i=0;i<ta.length;i++){
    if(ta[i].content&&ta[i].content.trim())entries.push({date:ta[i].date,text:ta[i].content.trim()});
  }
  if(entries.length===0)return;
  var pick=entries[Math.floor(Math.random()*entries.length)];
  state.dialogueDraft={originalDate:pick.date,originalText:pick.text,replyText:''};
  saveState();render();
}
function saveDialogueReply(){
  var d=state.dialogueDraft;if(!d)return;
  var inp=document.querySelector('[data-input="dialogue-reply"]');
  var reply=inp?inp.value.trim():'';
  if(!reply){state.dialogueDraft=null;render();return}
  state.dialogues.push({originalDate:d.originalDate,originalText:d.originalText,replyDate:getTodayISO(),replyText:reply});
  state.dialogueDraft=null;saveState();render();
}
function cancelDialogue(){state.dialogueDraft=null;saveState();render()}
function addConflict(){
  var d=state.conflictDraft||{want:'',but:'',because:''};
  if(!d.want.trim()||!d.but.trim())return;
  state.conflicts.push({id:uid(),want:d.want.trim(),but:d.but.trim(),because:(d.because||'').trim(),date:getTodayISO()});
  state.conflictDraft={want:'',but:'',because:''};saveState();render();
}
function toggleFitComplete(){
  var log=getFitLog();
  log.completed=!log.completed;
  if(log.completed){
    var day=getFitnessDay();
    var tpl=getTodayTemplate();
    var hasExisting=false;
    for(var i=0;i<state.outputs.length;i++){
      if(state.outputs[i].date===getTodayISO()&&state.outputs[i].type==='\u5065\u8eab'&&state.outputs[i].title.indexOf(tpl.label)>=0){hasExisting=true;break}
    }
    if(!hasExisting){
      var doneCount=0;
      if(log.exerciseDone)for(var k in log.exerciseDone){if(log.exerciseDone[k])doneCount++}
      var totalEx=tpl.exercises?tpl.exercises.length:0;
      state.outputs.unshift({id:uid(),type:'\u5065\u8eab',title:'Day '+day+' \u00b7 '+tpl.label,desc:'\u5b8c\u6210 '+doneCount+'/'+totalEx+' \u4e2a\u52a8\u4f5c\uff0c\u72b6\u6001\uff1a'+(log.status?{good:'\u{1F7E2}\u597d',average:'\u{1F7E1}\u4e00\u822c',poor:'\u{1F534}\u5dee'}[log.status]:'\u672a\u8bb0\u5f55'),date:formatDateISO(new Date())});
    }
  }
  saveState();render();
}
function toggleExercise(exId,dateStr){
  var log=getFitLog(dateStr);
  if(!log.exerciseDone)log.exerciseDone={};
  log.exerciseDone[exId]=!log.exerciseDone[exId];
  saveState();render();
}
function setFitStatus(status,dateStr){
  var log=getFitLog(dateStr);
  log.status=log.status===status?null:status;
  saveState();render();
}
function changeFitTemplate(dayNum,tplKey){
  if(!state.fitOverrides)state.fitOverrides={};
  if(state.fitOverrides[dayNum]===tplKey||(!state.fitOverrides[dayNum]&&FITNESS_DAY_MAP[dayNum]===tplKey)){
    delete state.fitOverrides[dayNum];
  }else{
    state.fitOverrides[dayNum]=tplKey;
  }
  saveState();render();
}

/* ===== EVENT HANDLERS ===== */

  switch(action){
    case 'toggle-task':toggleTask(ds.type,ds.id);break;
    case 'delete-task':deleteTask(ds.type,ds.id);break;
    case 'edit-task':editTask(ds.type,ds.id);break;
    case 'save-task-edit':saveTaskEdit(ds.type,ds.id);break;
    case 'cancel-task-edit':cancelTaskEdit();break;
    case 'open-add-form':openAddForm(ds.type,ds.category);break;
    case 'close-add-form':closeAddForm();break;
    case 'add-task':addTaskFromForm();break;
    case 'select-priority':selectPriority(ds.value);break;
    case 'select-preset':selectPreset(ds.value);break;
    case 'set-energy':setEnergy(ds.energyType,parseInt(ds.value));break;
    case 'set-approval':setApproval(ds.value==='true');break;
    case 'set-mood-weather':setMoodWeather(ds.value);break;
    case 'nav-review-tab':switchReviewTab(ds.value);break;
    case 'filter-memo':filterMemo(ds.value);break;
    case 'filter-output':filterOutput(ds.value);break;

    case 'close-add-output':closeAddOutput();break;
    case 'add-output':addOutput();break;

    case 'next-month':navigateMonth(1);break;
    case 'prev-fit-month':navigateFitMonth(-1);break;
    case 'next-fit-month':navigateFitMonth(1);break;
    case 'view-history':viewHistoryDay(ds.date);break;
    case 'back-from-history':backFromHistory();break;
    case 'growth-view':setGrowthView(ds.value);break;
    case 'add-belief':addBelief();break;
    case 'toggle-belief-outdated':toggleBeliefOutdated(ds.id);break;
    case 'start-dialogue':startDialogue();break;
    case 'save-dialogue-reply':saveDialogueReply();break;
    case 'cancel-dialogue':cancelDialogue();break;
    case 'add-conflict':addConflict();break;
    case 'toggle-fit-complete':toggleFitComplete();break;
    case 'fit-view':state.fitView=ds.value;state.fitViewDay=null;render();window.scrollTo(0,0);break;
    case 'view-fit-day':state.fitView='day-detail';state.fitViewDay=parseInt(ds.day);render();window.scrollTo(0,0);break;
    case 'fit-back-to-calendar':state.fitView='plan';state.fitViewDay=null;render();window.scrollTo(0,0);break;
    case 'toggle-exercise':toggleExercise(ds.ex,ds.date);break;
    case 'set-fit-status':setFitStatus(ds.status,ds.date);break;
    case 'fit-chart-range':state.fitChartRange=ds.value;saveState();render();break;
